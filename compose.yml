services:
  postgres:
    image: postgres:16-alpine
    container_name: user_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./internal/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - internal
  service:
    build:
      context: ./
      dockerfile: ./build/Dockerfile
    container_name: service
    env_file:
      - .env
    environment:
      ENV: "development"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_PRIVATE_KEY: /run/secrets/private_key.pem
      JWT_PUBLIC_KEY: /run/secrets/public_key.pem
      SESSION_DURATION: 720h
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "${APPLICATION_PORT}:${APPLICATION_PORT}"
    volumes:
      - ./logs:/root/logs
      - ./keys:/run/secrets
    networks:
      - internal

  redis:
    image: redis:7.4-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 1s
      timeout: 3s
      retries: 30
    networks:
      - internal

volumes:
  redis_data:
    driver: local

networks:
  internal: